[project]
name = "knowledge-harness"
version = "0.1.0"
description = "Deterministic core for the knowledge-harness plugin"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = [
    "pytest>=8",
    "ruff==0.15.21",
    "pytest-cov==7.1.0",
    "mutate4py==0.1.4",
    "crap4py==0.1.1",
    "drywall==0.1.3",
    "mypy==2.3.1",
    "pyzotero[cli]==1.14.0",  # dev-lane agent instrument (adopted 2026-08-22 by contract match:
                              # canonical library, local-API-first, read-only by default, local
                              # writes gated behind Zotero's own consent dialog — admission stays
                              # human by construction; live-verified local read at adoption).
                              # Web API permitted for tests: read-only key by default; a
                              # write-capable key only for a test that needs it, never against
                              # the real library. No key is stored in this repo.
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-frontmatter==2.1.2",
    "yamlfix==1.19.1",
    "pyproject-fmt==2.28.0",
    "pre-commit==4.6.2",
]

[tool.pytest.ini_options]
markers = [
    "live: requires a running local Zotero (set HARNESS_LIVE=1)",
    "live_net: hits real external APIs (set HARNESS_LIVE_NET=1 and HARNESS_MAILTO)",
]

[tool.ruff]
required-version = "==0.15.21"
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "A",
    "B",
    "C4",
    "I",
    "PIE",
    "PLE",
    "PT",
    "RUF100",
    "SIM",
    "T10",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_cli_live.py" = ["UP012"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_harness*"]

[tool.setuptools.package-data]
knowledge_harness = ["templates/**/*"]
