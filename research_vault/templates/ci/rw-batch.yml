---
name: rw-batch
on:
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch: {}
concurrency:
  group: rw-batch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  retraction-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-vault
        run: python -m pip install "research-vault @ git+https://github.com/eranroseman/research-vault.git"
      - name: Download Retraction Watch CSV
        run: curl --fail --show-error --location --output "$RUNNER_TEMP/rw.csv" https://gitlab.com/crossref/retraction-watch-data/-/raw/main/retraction_watch.csv
      - name: Configure snapshot identity
        run: |
          git config user.name "research-vault-ci"
          git config user.email "actions@users.noreply.github.com"
      - name: Run CSV-only audit and publish exact snapshot
        shell: bash
        run: |
          set +e
          python -m research_vault verify --vault . --offline --surface audit --git-candidate worktree --rw-csv "$RUNNER_TEMP/rw.csv" --changed-paths-file "$RUNNER_TEMP/research-vault-changed-paths" --commit-projected "chore: rw-batch findings"
          code=$?
          set -e
          case "$code" in
            0) exit 0 ;;
            1)
              echo "::error::CSV audit unexpectedly reported a closing failure"
              exit 1
              ;;
            3)
              echo "::error::CSV audit unexpectedly reported an outage"
              exit 3
              ;;
            *)
              echo "::error::CSV audit exited unexpectedly with status $code"
              exit "$code"
              ;;
          esac
      - name: Push verifier-created snapshot
        shell: bash
        run: |-
          set -euo pipefail
          manifest="$RUNNER_TEMP/research-vault-changed-paths"
          if [[ ! -s "$manifest" ]]; then
            echo "No verifier-owned changes."
            exit 0
          fi
          git push
