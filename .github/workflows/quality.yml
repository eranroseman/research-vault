---
name: quality
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: 17 4 * * 1
# A newer push to the same branch supersedes its run; a push to main is a
# landing and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  quality:
    # The required status check (the ruleset on main names this context):
    # form and lint, the offline suite with branch coverage, the CRAP ceiling
    # and the duplicate gate. It reports in ~4 min; a landing waits for this
    # job and never for the mutation gate below.
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nothing after checkout fetches or pushes
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      # GitHub-hosted runners carry no git identity (actions/checkout writes only
      # safe.directory and the auth header). The suite does not consult this
      # one: every unmarked test and both session template vaults commit under
      # tests/conftest.py::OFFLINE_GIT_IDENTITY, the global config of a per-test
      # HOME. Belt for any process outside that HOME -- a hook or tool run from
      # the workspace. Same identity research-vault's own vault CI template uses.
      - name: Git identity (belt for processes outside the per-test HOME)
        run: |
          git config --global user.name "research-vault-ci"
          git config --global user.email "actions@users.noreply.github.com"
      - name: Form + lint (the one command — same as local)
        run: pre-commit run --all-files --show-diff-on-failure
      # The manual-stage hooks below are `language: system` hooks that need shfmt
      # and shellcheck on PATH. Both are installed here, pinned exact; the
      # downloaded binaries (these two and actionlint below) are digest-checked.
      # Every tool in this lane is pinned exact, but only the downloads carry a
      # digest: the pip-installed tools are version pins, and actions/* are major
      # tags (commit d402858's subject, "every tool pinned and digest-checked",
      # overstated this; the subject is history, this comment is the record).
      # The runner image's own shellcheck floats with the image (0.9.0 on 24.04,
      # 0.11.x on 26.04), so it is never used; /usr/local/bin precedes it on PATH
      # and the version is asserted. A tag pins a name, the digest pins the bytes.
      # actionlint below shells out to whichever shellcheck is on PATH, so this
      # step also precedes it.
      - name: Install shfmt + shellcheck (pinned, digest-checked)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/shfmt" https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  $RUNNER_TEMP/shfmt" | sha256sum -c
          sudo install -m 0755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          test "$(shellcheck --version | sed -n 's/^version: //p')" = 0.11.0
      - name: Residual binary hooks (manual stage)
        run: pre-commit run --all-files --hook-stage manual
      # Pinned binary, not a marketplace action: a floating third-party tag executes
      # whatever it resolves to on the day. The two vault CI templates render into
      # every user vault, so they are linted here as the workflow files they are.
      - name: Workflow lint (actionlint, pinned, digest-checked)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/quality.yml research_vault/templates/ci/verify.yml research_vault/templates/ci/rw-batch.yml
      # -n here, never in addopts: ambient -n races the local Zotero and nests a pool per mutant.
      - name: Tests + branch coverage
        run: python -m pytest tests -q -n auto --dist worksteal --cov=research_vault
          --cov-branch --cov-report=lcov:lcov.info
      # The ceiling is 30 and stays 30 (986086e). The two functions that sat
      # above it — `_bump_generated` (archive.py) and `check_metadata`
      # (checks.py) — were deleted by the ingest redesign (2026-09), so the
      # dated deferral decision 21 carried is closed and this step fails the
      # lane again on any new breach.
      - name: CRAP ceiling (crap4py)
        run: crap4py research_vault --lcov lcov.info --max-crap 30
      - name: Duplicate gate (drywall)
        run: drywall research_vault
  mutation-gate:
    # Not a required check: a landing does not wait for it. It runs after
    # `quality` on every push and on workflow_dispatch, diffs origin/main...HEAD
    # -- empty on a push to main by construction, so the gate earns its keep on
    # branch pushes -- and runs mutmut over the research_vault modules the diff
    # touches, failing on any survivor mutation-baseline.txt does not carry.
    # The gate sets PYTHONPATH to its own shims, so the [dev] install is all it
    # needs. Its timeout has one writer: the repository variable
    # MUTATION_GATE_TIMEOUT_MINUTES (`gh variable set`), read here through
    # fromJSON because `timeout-minutes` takes a number and `vars.*` is a
    # string; the gate step reads the same variable for its time budget.
    name: mutation-gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.MUTATION_GATE_TIMEOUT_MINUTES) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the gate diffs against origin/main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Git identity (belt for processes outside the per-test HOME)
        run: |
          git config --global user.name "research-vault-ci"
          git config --global user.email "actions@users.noreply.github.com"
      # --max-children 2 with --child-address-space 3GiB: 2 × 3 GiB = 6 GiB bounds
      # the children on both the 7 GB and the 16 GB ubuntu-latest runners. A bound,
      # not a guarantee: the mutmut parent and every subprocess a test spawns
      # carry the same cap, so the strict form is (children + 1 + concurrent test
      # subprocesses) × cap, and the product only holds the OOM killer off while
      # at most one child runs away at a time. The cap is per child (RLIMIT_AS),
      # so the one runaway-allocation mutant measured so far (selectors.py: one
      # child at 2.0 GB, then five at 1.6–2.2 GB, which OOM-killed a whole 8 GB
      # cgroup twice on 2026-09-14) dies at 3 GiB with a MemoryError — a killed
      # mutant, not a dead runner. The child count is a runner-memory bound, not a
      # measured optimum.
      # --max-mutants 9000 is the CI mutant budget: a changed set that would run
      # more mutants is reported as "not measured" (exit 0) instead of run, so an
      # integration-sized diff reads unmeasured rather than hitting the job
      # limit. Arithmetic, MEASURED on run 34827110718 (2026-09-14, a
      # one-module diff — scaffold.py, 1,308 mutants — at two children on the
      # 4-vCPU runner: gate step 41 min 02 s, ≈0.53 mutants/s step-inclusive).
      # mutmut's phases are not separable in the log, so the fixed cost per gate
      # run is taken as ≈5 min (mutant generation 78 s and the stats phase ≈3 min
      # on run 34822363722, plus the per-module clean run), which puts the mutant
      # phase at 1,308 / ((41.0 − 5) × 60) ≈ 0.61 mutants/s; the other steps take
      # ≈3 min. 9,000 / 0.61 / 60 ≈ 246 min of mutants + 5 + 3 ≈ 254 min: under
      # 360 with ≈30 % headroom, so the provisional 9,000 (360 × 0.75 − 10 min at
      # an assumed 0.6/s) stands as measured. The job timeout (the variable) is
      # this worst case plus ≈18 % variance. The steady state is small diffs
      # (one module ≈40 min); an oversize one is run locally.
      - name: Mutation gate (no new survivors)
        run: python scripts/mutation_gate.py --base origin/main --max-children 2 --child-address-space
          3GiB --max-mutants 9000
  okf-spec-drift:
    name: OKF spec drift (pin vs upstream)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # gh authenticates through GH_TOKEN below
      - name: Compare upstream SPEC.md against the pin
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: 26aa5da029278939f914e578107242d9607d4f2dc5fe153272b82f9ed1030101
        run: |-
          set -euo pipefail
          curl --fail --silent --show-error --location --output /tmp/SPEC.md \
            https://raw.githubusercontent.com/GoogleCloudPlatform/open-knowledge-format/main/SPEC.md
          actual="$(sha256sum /tmp/SPEC.md | cut -d' ' -f1)"
          if [ "$actual" != "$PINNED" ]; then
            title="OKF SPEC.md drifted from the ad30107 pin"
            if ! gh issue list --state open --search "$title" --json title -q '.[].title' | grep -qF "$title"; then
              # The body is built with printf, never written as a multi-line YAML
              # string. yamlfix rewrites blank lines inside a block scalar to match
              # its `whitelines` setting -- measured: default deletes them, `2` invents
              # one -- so a literal blank line here is data it will corrupt, turning
              # the blockquote into a paragraph-swallowing quote. Config cannot fix it:
              # the setting is global and no single value is right for every scalar.
              # With no blank line in the YAML there is nothing left to rewrite.
              body=$(printf '%s\n\n%s\n' \
                "> *Opened automatically by the okf-spec-drift job.*" \
                "Upstream \`SPEC.md\` sha256 is \`$actual\`; the pin is \`$PINNED\` (\`open-knowledge-format@ad30107\`). Reconcile per ADR 0001: read the diff, decide adopt/deviate, move the pin deliberately.")
              gh issue create --title "$title" --label needs-triage --body "$body"
            fi
          fi
