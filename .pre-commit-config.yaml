# The ONE command for every form/lint check, when typed, and in CI:
#     source .venv/bin/activate && pre-commit run --all-files
# In a shared checkout, run the form owner directly on the touched files
# before committing instead: `pre-commit run` also stashes unstaged changes,
# onto a git stash stack shared by every worktree of this repo, and is NOT
# the safe form here.
# Repo-local system hooks over the pinned venv — no remote hook repos, no network
# at check time. This is the DEV-LANE pre-commit; the vault's pre-commit
# (knowledge_harness/templates/git/pre-commit) is a trust gate — do not conflate.
# default pinned so `--hook-stage manual` selects ONLY the manual hooks below.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      # skills/find-sources/scripts/*.py stay OUT of this path list: a frozen
      # vendored fork (K-Dense's paper-lookup skill) — re-vendor from upstream
      # to pick up fixes; running our formatter/linter over it would create
      # vendor drift instead of tracking upstream's own form.
      - id: ruff-format
        name: "form: python (ruff format)"
        language: system
        entry: bash -c 'ruff format knowledge_harness tests scripts hooks'
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: "lint: python (ruff)"
        language: system
        entry: bash -c 'ruff check knowledge_harness tests scripts hooks'
        pass_filenames: false
        always_run: true
      - id: mypy
        name: "types: python (mypy rung-1)"
        language: system
        entry: bash -c 'mypy knowledge_harness'
        pass_filenames: false
        always_run: true
      # --number is part of the canonical form, every invocation including --check:
      # this markdown is read RAW by agents and carries numeric cross-references;
      # mdformat's default collapses ordered lists to all `1.`, so "item 6" would
      # point at nothing. It owns every tracked Markdown file except the ephemeral
      # `.superpowers/`, `.worktrees/`, and `.claude/worktrees/` workspaces, plus
      # the vault index below. A staged Markdown file joins this set automatically.
      # Vault-dialect templates (wikilinks, managed-region markers, Base embeds)
      # belong to their sole writer, not the CommonMark owner: vault/index.md is
      # the only functional exception because mdformat measurably escapes its
      # wikilinks and Base embeds on contact. Its compatible owner is tracked in
      # GitHub issue #70.
      - id: mdformat
        name: "form: markdown CommonMark (mdformat)"
        language: system
        entry: bash -c 'mdformat --number --wrap keep $(git ls-files -- "*.md" |
          grep -v -e "^\\.superpowers/" -e "^\\.worktrees/" -e
          "^\\.claude/worktrees/" -e
          "^knowledge_harness/templates/vault/index\\.md$")'
        pass_filenames: false
        always_run: true
      # .pre-commit-config.yaml itself is yaml but stays OUT of this path
      # list: yamlfix would reflow this file's hand-wrapped, comment-adjacent
      # entries (quoting, line breaks) into its own form, trading away the
      # readability the wrapping exists for — a choice, not an oversight.
      - id: yamlfix
        name: "form: yaml (yamlfix)"
        language: system
        entry: bash -c 'yamlfix .github/workflows knowledge_harness/templates/ci'
        pass_filenames: false
        always_run: true
      # All three flags are load-bearing: --keep-full-version (bare tool loosens
      # `==1.0.0` to `==1`), --no-generate-python-version-classifiers (invents
      # untested support claims), --table-format long (keeps comments beside the
      # keys they rule). Constraint: pyproject comments must sit directly ABOVE
      # their key — the tool reorders, and a floating comment lands on the wrong
      # setting.
      - id: pyproject-fmt
        name: "form: toml (pyproject-fmt)"
        language: system
        entry: bash -c 'pyproject-fmt --keep-full-version
          --no-generate-python-version-classifiers --table-format long pyproject.toml'
        pass_filenames: false
        always_run: true
      - id: config-validity
        name: "lint: json canonical + skill frontmatter (suite)"
        language: system
        entry: bash -c 'python -m pytest tests/test_config_validity.py -q'
        pass_filenames: false
        always_run: true
      # Manual stage: binary tools not required locally; CI runs them.
      - id: shellcheck
        name: "lint: shell (shellcheck)"
        language: system
        entry: shellcheck knowledge_harness/templates/git/pre-commit
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: shfmt
        name: "form: shell (shfmt, diff mode)"
        language: system
        entry: shfmt -d -i 2 -ci knowledge_harness/templates/git/pre-commit
        pass_filenames: false
        always_run: true
        stages: [manual]
