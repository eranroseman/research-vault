[project]
name = "harness-core"
version = "0.1.0"
description = "Deterministic core for the knowledge-harness plugin"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = [
    "pytest>=8",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
markers = [
    "live: requires a running local Zotero (set HARNESS_LIVE=1)",
    "live_net: hits real external APIs (set HARNESS_LIVE_NET=1 and HARNESS_MAILTO)",
]

[tool.ruff]
required-version = "==0.15.21"
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "A",
    "B",
    "C4",
    "I",
    "PIE",
    "PLE",
    "PT",
    "RUF100",
    "SIM",
    "T10",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_cli_live.py" = ["UP012"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness_core*"]

[tool.setuptools.package-data]
harness_core = ["templates/**/*"]
