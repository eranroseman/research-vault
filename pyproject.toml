[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=68" ]

[project]
name = "research-vault"
version = "0.1.0"
description = "Deterministic core for the research-vault plugin"
# Floor matches mutate4py's own >=3.11; nothing tests or claims 3.10.
requires-python = ">=3.11"
dependencies = [
  # Lazy-imported at research_vault's single parse site (package boundary only —
  # the vendored find-sources scripts parse via stdlib by upstream's choice, recorded
  # in that skill's vendoring notes).
  "defusedxml==0.7.1",
]
[project.optional-dependencies]
pdf = [ "pypdf>=4" ]
dev = [
  "crap4py==0.1.1",
  "drywall==0.1.3",
  # FORMAT + RENDER-CONTRACT pin: mdformat owns every tracked CommonMark file
  # selected by .pre-commit-config.yaml; template form also leaks into rendered
  # vault notes.
  # Upgrade protocol (mdformat pinned; upgrades are deliberate acts, matching
  # ruff's protocol below): a canonical-form-changing upgrade is a corpus-format
  # and render-contract change. Before updating, run the exact mdformat hook from
  # .pre-commit-config.yaml over a clean worktree and review its complete diff.
  # Also confirm every `%%rv-managed%%` / `%%/rv-managed%%` marker survives
  # byte-for-byte in research_vault/templates/vault/AGENTS.md,
  # CONTEXT.md, and system/templates/literature.md; block an upgrade if it
  # starts escaping `%%` sequences. vault/index.md remains excluded pending #70;
  # never feed that Obsidian-dialect template to mdformat during this review.
  "mdformat==1.0.0",
  "mdformat-frontmatter==2.1.2",
  "mdformat-gfm==1.0.0",
  "mutate4py==0.1.4",
  "mutmut==3.7.0",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pyproject-fmt==2.28.0",
  "pytest>=8",
  "pytest-cov==7.1.0",
  # Pass `-n auto` ON THE COMMAND LINE, never in addopts: ambient parallelism races
  # the single Zotero instance, and mutation runs would nest a pool per mutant.
  "pytest-xdist==3.8.0",
  # Dev-lane instrument, read-only posture: local writes sit behind Zotero's own
  # consent dialog; web-API write keys never against the real library; no key in repo.
  "pyzotero[cli]==1.14.0",
  "ruff==0.15.21",
  "yamlfix==1.19.1",
]

[tool.setuptools.packages.find]
include = [ "research_vault*" ]
[tool.setuptools.package-data]
research_vault = [ "templates/**/*" ]

[tool.ruff]
required-version = "==0.15.21"
# Explicit (ruff would infer from requires-python only when absent) — the two
# move together on any floor bump.
target-version = "py311"
line-length = 88
[tool.ruff.lint]
# Bandit idiom exclusions — see `ignore` below: these fire on this repo's own
# architecture, not on findings. S602/S604 (shell=True) stay active inside "S".
#   S310 - urlopen IS the four-state network layer, https-only
#   S603 - fires on every list-form subprocess call (git plumbing is the design)
#   S607 - "git" by name, resolved via PATH, is the intended invocation
# Deliberately NOT selected — do not "fix":
#   PLR   — pylint-refactor thresholds: PLR0911's "too many returns" flags four-state
#           outcome mappers (multi-return IS the doctrine's shape); PLR2004 flags HTTP
#           codes; complexity rows are covered by C90 + the CRAP ceiling
#   BLE   — the four-state doctrine requires broad catch -> UNREACHABLE in probe
#           wrappers and fail-open hooks; this rule fights the architecture
#   ANN   — mypy owns typing: it checks annotations are TRUE, ANN only that they exist
#   D     — docstrings unenforced by decision: presence/format checks can't verify truth,
#           and the meaning layer lives in CONTEXT.md/spec; docstrings stay by convention
# C90 IS selected: below the CRAP ceiling a CC cap catches complexity laundered by
# high coverage. Backstop, not the risk gate.
# Upgrade protocol (ruff pinned; upgrades are deliberate acts): newer ruff versions
# default-enable curated singles from BLE/D/TRY/PL — the skip list above — and
# extend-select cannot unselect defaults. On any ruff upgrade: diff the new version's
# defaults (ruff check --isolated --show-settings) against these skips and move any
# violated skip into `ignore`, or the recorded rulings silently stop being true.
extend-select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "DTZ",
  "EXE",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "INT",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PLE",
  "PLW",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TC",
  "UP",
  "W",
  "YTT",
]
ignore = [ "S310", "S603", "S607" ]
[tool.ruff.lint.per-file-ignores]
# unicode fixtures deliberate; assert IS pytest.
# ARG in tests only: a monkeypatch double's unused parameters ARE the signature it
# honours, and a side-effect fixture is named but never read. Guard stays armed in core.
"tests/*" = [ "ARG", "RUF001", "RUF002", "RUF003", "S101" ]
"tests/test_cli_live.py" = [ "UP012" ]
# print IS the CLI output contract.
"research_vault/__main__.py" = [ "T20" ]
# Gate scripts report via stdout by design.
"scripts/*" = [ "T20" ]
# PTH off in gitstate ONLY: this module IS the byte-exact path plane — vault paths
# are raw bytes pathlib cannot hold, os.path.abspath is NOT Path.resolve() (resolve
# follows symlinks; containment requires not), and Path.readlink() normalises where
# snapshot/restore must be byte-exact.
"research_vault/gitstate.py" = [ "PTH" ]
# Test side of the same ruling: fixtures are deliberately non-UTF-8 byte paths
# pathlib cannot construct.
"tests/test_gitstate.py" = [ "PTH" ]
"tests/test_verify_cli.py" = [ "PTH" ]
# ~2x the package's measured C901 maximum — deliberate slack so this cap never
# competes with the CRAP ceiling for the same decision; it catches only what a high
# coverage number hid. C901 and crap4py's CC are DIFFERENT metrics (crap4py is
# expression-aware and reads far higher); neither subsumes the other.
[tool.ruff.lint.mccabe]
max-complexity = 28

# Ratchet: disallow_incomplete_defs -> disallow_untyped_defs as code gets annotated.
# Full --strict waits for the evidence shapes to be modeled as TypedDicts — before
# that it invites cast()-laundered "asserted, not verified" types at JSON boundaries.
[tool.mypy]
files = [ "research_vault" ]
# rung 1: untyped function bodies are checked.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
# pypdf: optional [pdf] extra; the dev lane installs [dev] only.
[[tool.mypy.overrides]]
module = "pypdf.*"
ignore_missing_imports = true

# defusedxml ships no py.typed (verified 0.7.1); its stubs live in typeshed's
# third-party set, which this lane deliberately does not install.
[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "live: requires a running local Zotero (set RV_LIVE=1)",
  "live_net: hits real external APIs (set RV_LIVE_NET=1 and RV_MAILTO)",
]
# Pinning collection here makes bare `pytest` and `python -m pytest` resolve
# scripts.* imports identically.
pythonpath = [ "." ]
testpaths = [ "tests" ]
