---
name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install research-vault
        run: python -m pip install "research-vault @ git+https://github.com/eranroseman/research-vault.git"
      - name: Resolve and fetch comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          empty_tree="$(git hash-object -w -t tree /dev/null)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ -n "$PUSH_BASE" && "$PUSH_BASE" != "$zero" ]]; then
            base="$PUSH_BASE"
          else
            base="$empty_tree"
          fi
          if [[ "$base" != "$empty_tree" ]]; then
            git fetch --no-tags origin "$base"
          fi
          git cat-file -e "$base^{tree}"
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Verify committed changes
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |-
          set +e
          python -m research_vault verify --vault . --offline --surface commit --git-base "$BASE" --git-candidate HEAD
          code=$?
          set -e
          case "$code" in
            0) exit 0 ;;
            1) exit 1 ;;
            3)
              echo "::warning::verification unreachable; no closing mismatch reported"
              exit 0
              ;;
            *)
              echo "::error::verifier exited unexpectedly with status $code"
              exit "$code"
              ;;
          esac
