---
name: quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 17 4 * * 1
# A newer push to the same ref supersedes a PR run; a push-to-main run is a
# landing and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  quality:
    name: dev-quality lane (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # mutation gate diffs against the merge base
          persist-credentials: false  # nothing after checkout fetches or pushes
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      # GitHub-hosted runners carry no git identity (actions/checkout writes only
      # safe.directory and the auth header), and the test fixtures commit into
      # `git init` temp repos outside the workspace, so --global is load-bearing.
      # Same identity research-vault's own vault CI template uses.
      - name: Git identity (tests commit into temp repos)
        run: |
          git config --global user.name "research-vault-ci"
          git config --global user.email "actions@users.noreply.github.com"
      - name: Form + lint (the one command — same as local)
        run: pre-commit run --all-files --show-diff-on-failure
      # The manual-stage hooks below are `language: system` hooks that need shfmt
      # and shellcheck on PATH. Both are installed here, pinned exact and
      # digest-checked, like every other tool in this lane: the runner image's own
      # shellcheck floats with the image (0.9.0 on 24.04, 0.11.x on 26.04), so it is
      # never used; /usr/local/bin precedes it on PATH and the version is asserted.
      # A tag pins a name, the digest pins the bytes. actionlint below shells out to
      # whichever shellcheck is on PATH, so this step also precedes it.
      - name: Install shfmt + shellcheck (pinned, digest-checked)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  $RUNNER_TEMP/shfmt" | sha256sum -c
          sudo install -m 0755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          test "$(shellcheck --version | sed -n 's/^version: //p')" = 0.11.0
      - name: Residual binary hooks (manual stage)
        run: pre-commit run --all-files --hook-stage manual
      # Pinned binary, not a marketplace action: a floating third-party tag executes
      # whatever it resolves to on the day. The two vault CI templates render into
      # every user vault, so they are linted here as the workflow files they are.
      - name: Workflow lint (actionlint, pinned, digest-checked)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/quality.yml research_vault/templates/ci/verify.yml research_vault/templates/ci/rw-batch.yml
      # -n here, never in addopts: ambient -n races the local Zotero and nests a pool per mutant.
      - name: Tests + branch coverage
        run: python -m pytest tests -q -n auto --dist worksteal --cov=research_vault
          --cov-branch --cov-report=lcov:lcov.info
      # continue-on-error is a DATED DEFERRAL, not a softened gate. The ceiling is
      # 30 and stays 30 (986086e: "Lowering the ceiling was explicitly rejected").
      # One function is over it and is deliberately not being fixed yet:
      # `_bump_generated` (archive.py, CRAP 43.1) is a coverage gap in a module
      # whose survival is open — the assembly spec ties archive.py to lane 1's
      # URL-only decision (§7.2), so testing it now may test code about to be
      # deleted. (`check_metadata`, the other function this note tracked, was
      # deleted retiring the doi/metadata checks, ingest spec §6.)
      # Left hard-failing, this step failed 189 consecutive runs and SKIPPED every
      # step below it — drywall and the mutation gate have not run since
      # 2026-08-25, and a genuinely broken test read the same red as the debt.
      # That is what this buys: the lane goes red for NEW breakage and stays
      # legible while the known debt is carried. Remove this line when the
      # function lands under the ceiling; the exit condition is lane 1 deciding
      # archive.py, and it is tracked at spec §15.22.
      - name: CRAP ceiling (crap4py)
        continue-on-error: true
        run: crap4py research_vault --lcov lcov.info --max-crap 30
      - name: Duplicate gate (drywall)
        run: drywall research_vault
      # No-op on push by construction (origin/main...HEAD is empty after a landing);
      # this gate earns its keep on pull_request and workflow_dispatch. It runs
      # mutmut over the research_vault modules the diff touches and fails on any
      # survivor that mutation-baseline.txt (all 34 modules) does not carry; the
      # gate sets PYTHONPATH to its own shims, so the [dev] install is all it needs.
      # --max-children 2 with --child-address-space 3GiB: 2 × 3 GiB = 6 GiB fits
      # both the 7 GB and the 16 GB ubuntu-latest runners. The cap is per child
      # (RLIMIT_AS), so the one runaway-allocation mutant measured so far
      # (selectors.py: one child at 2.0 GB, then five at 1.6–2.2 GB, which
      # OOM-killed a whole 8 GB cgroup twice on 2026-09-14) dies at 3 GiB with a
      # MemoryError — a killed mutant, not a dead runner. The child count is a
      # runner-memory bound, not a measured optimum.
      - name: Mutation gate (no new survivors)
        run: python scripts/mutation_gate.py --base "origin/${{ github.base_ref || 'main' }}"
          --max-children 2 --child-address-space 3GiB
  okf-spec-drift:
    name: OKF spec drift (pin vs upstream)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # gh authenticates through GH_TOKEN below
      - name: Compare upstream SPEC.md against the pin
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: 26aa5da029278939f914e578107242d9607d4f2dc5fe153272b82f9ed1030101
        run: |-
          set -euo pipefail
          curl --fail --silent --show-error --location --output /tmp/SPEC.md \
            https://raw.githubusercontent.com/GoogleCloudPlatform/open-knowledge-format/main/SPEC.md
          actual="$(sha256sum /tmp/SPEC.md | cut -d' ' -f1)"
          if [ "$actual" != "$PINNED" ]; then
            title="OKF SPEC.md drifted from the ad30107 pin"
            if ! gh issue list --state open --search "$title" --json title -q '.[].title' | grep -qF "$title"; then
              # The body is built with printf, never written as a multi-line YAML
              # string. yamlfix rewrites blank lines inside a block scalar to match
              # its `whitelines` setting -- measured: default deletes them, `2` invents
              # one -- so a literal blank line here is data it will corrupt, turning
              # the blockquote into a paragraph-swallowing quote. Config cannot fix it:
              # the setting is global and no single value is right for every scalar.
              # With no blank line in the YAML there is nothing left to rewrite.
              body=$(printf '%s\n\n%s\n' \
                "> *Opened automatically by the okf-spec-drift job.*" \
                "Upstream \`SPEC.md\` sha256 is \`$actual\`; the pin is \`$PINNED\` (\`open-knowledge-format@ad30107\`). Reconcile per ADR 0001: read the diff, decide adopt/deviate, move the pin deliberately.")
              gh issue create --title "$title" --label needs-triage --body "$body"
            fi
          fi
